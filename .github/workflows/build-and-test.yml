name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore packages
      run: dotnet restore RaceDayApi.sln

    - name: Build
      run: dotnet build RaceDayApi.sln --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test RaceDayApi.sln --no-build --configuration Release --verbosity normal