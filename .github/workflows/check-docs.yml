name: Validate Docs Folder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check required files exist
        run: |
          test -f "docs/RaceDay_Database_Script.sql" && echo "SQL script found" || (echo "Missing SQL script" && exit 1)
          test -f "docs/PROG.png" && echo "ERD found" || (echo "Missing ERD" && exit 1)
          test -f "docs/RaceDay API Endpoint Plan.pdf" && echo "API endpoint plan found" || (echo "Missing API endpoint plan" && exit 1)